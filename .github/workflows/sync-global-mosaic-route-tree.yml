name: Sync global mosaic route tree

on:
  push:
    branches:
      - feat/global-all-sky-mosaic
    paths:
      - ".github/workflows/sync-global-mosaic-route-tree.yml"
      - "src/routes/api/mosaic/hips/$.ts"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/global-all-sky-mosaic
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate route tree through Vite
        shell: bash
        run: |
          set +e
          npm run build
          build_status=$?
          set -e
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "TanStack did not modify src/routeTree.gen.ts"
            exit "$build_status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Regenerate TanStack route tree for global mosaic"
          git push origin HEAD:feat/global-all-sky-mosaic
          exit "$build_status"
