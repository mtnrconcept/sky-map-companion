name: Refresh public all-sky aggregate once

on:
  push:
    branches:
      - feat/public-all-sky-ingestion
    paths:
      - ".github/workflows/ops-refresh-public-allsky-once.yml"

permissions:
  contents: read

# Match the currently deployed catalogue workflow until PR #47 moves both
# permanent workflows onto the shared archive-catalog-runner group.
concurrency:
  group: catalogue-sky-map-mosaic
  cancel-in-progress: false

env:
  SKY_SUPABASE_PROJECT_REF: olnkshywagvxzolndtsg
  SKY_SUPABASE_REGION: eu-west-3
  PIPELINE_VERSION: science-v1
  LEASE_SECONDS: "300"
  POLL_SECONDS: "2"
  MAX_DERIVATIVE_BYTES: "524288000"
  MAX_DOWNLOAD_BYTES: "5368709120"
  MAX_MASTER_PIXELS: "40000000"
  MAX_SCALE_DEGRADATION: "2.5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/public-all-sky-ingestion

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/science/pyproject.toml

      - name: Issue bounded catalogue database credential
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          project_ref = os.environ["SKY_SUPABASE_PROJECT_REF"]
          region = os.environ["SKY_SUPABASE_REGION"]
          supabase_url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          secret_key = os.environ["SUPABASE_SECRET_KEY"].strip()
          headers = {
              "apikey": secret_key,
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          if secret_key.count(".") == 2:
              headers["Authorization"] = f"Bearer {secret_key}"
          request = Request(
              f"{supabase_url}/rest/v1/rpc/issue_archive_catalog_runner_credential",
              data=b"{}",
              headers=headers,
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              credential = json.load(response)
          if isinstance(credential, str):
              credential = json.loads(credential)
          username = str(credential["username"])
          password = str(credential["password"])
          print(f"::add-mask::{password}")
          database_url = (
              f"postgresql://{quote(username, safe='')}:{quote(password, safe='')}"
              f"@aws-0-{region}.pooler.supabase.com:5432/postgres?sslmode=require"
          )
          print(f"::add-mask::{database_url}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"DATABASE_URL={database_url}\n")
              output.write(f"WORKER_ID=github-allsky-refresh-{os.environ['GITHUB_RUN_ID']}\n")
              output.write("ARCHIVE_CATALOG_CREDENTIAL_ISSUED=true\n")

      - name: Install science worker
        run: python -m pip install -e 'workers/science[test]'

      - name: Rebuild aggregate and Allsky
        run: sky-public-sky-loworder --filter r

      - name: Revoke bounded catalogue database credential
        if: ${{ always() && env.ARCHIVE_CATALOG_CREDENTIAL_ISSUED == 'true' }}
        shell: python
        run: |
          import os
          from urllib.request import Request, urlopen

          secret_key = os.environ["SUPABASE_SECRET_KEY"]
          headers = {"apikey": secret_key, "Content-Type": "application/json"}
          if secret_key.count(".") == 2:
              headers["Authorization"] = f"Bearer {secret_key}"
          request = Request(
              f"{os.environ['SUPABASE_URL'].rstrip('/')}/rest/v1/rpc/revoke_archive_catalog_runner_credential",
              data=b"{}",
              headers=headers,
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              response.read()
